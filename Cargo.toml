[package]
name = "olive-mlt-bridge"
version = "0.1.9"
edition = "2021"

authors = ["Itai Bar-Haim", "Antigravity"]
description = "A high-performance GPU-accelerated drop-in replacement for MLT and melt in Kdenlive"

[lib]
name = "mlt_7"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "melt"
path = "src/bin/melt.rs"

[dependencies]
# XML parsing for .mlt project files
roxmltree = "0.20"

# Dynamic library loading to proxy unsupported services to upstream libmlt-7.so
libloading = "0.8"

# Fast image loading and processing
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "pnm"] }

# Math and keyframe interpolation
glam = "0.29"

# CLI argument parsing
clap = { version = "4.5", features = ["derive"] }

# Logging
log = "0.4"
env_logger = "0.11"

# Rayon for parallel processing
rayon = "1.10"
